name: Check code with TypeScript & Lint

on:
  pull_request:
    branches:
      - 'master'
  merge_group:

# Cancel old builds on new commit for same workflow + branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Needs no dependencies, so it runs before install and fails fast. Catches a
      # class of bug that only breaks on case-insensitive filesystems (macOS and
      # Windows dev machines) and is therefore invisible to typecheck/lint on CI.
      - name: Check for case-sensitivity hazards
        run: node scripts/check-case-hazards.mjs

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm run typecheck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Lint
        run: pnpm run lint
