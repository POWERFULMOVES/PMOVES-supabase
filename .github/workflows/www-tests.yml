name: Marketing site tests

on:
  pull_request:
    branches: ['master']
    paths:
      - 'apps/www/**/*.ts*'
      - 'packages/common/sentry.ts'
      - 'packages/common/sentry.test.ts'
      - 'apps/www/next.config.mjs'
      - 'apps/www/next.config.js'
      - 'apps/www/lib/**/*.js'
      - 'apps/www/lib/**/*.mjs'
      - 'apps/www/content/md/**'
      - 'apps/www/scripts/**/*.mjs'
      - 'apps/www/internals/**/*.mjs'
      - 'apps/www/_blog/**'
      - 'apps/www/_alternatives/**'
      - 'apps/www/_customers/**'
      - 'apps/www/public/.well-known/**'
      # www catalog tests check that linked docs guides exist, so guide changes
      # must trigger these tests and their sources must be included in checkout.
      - 'apps/docs/content/guides/**'

# Cancel old builds on new commit for same workflow + branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/www
            apps/docs/content/guides
            packages
            supabase
            patches

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test
        working-directory: ./apps/www
